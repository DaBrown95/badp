MEMORY {
    HEADER: start = $0000, size = $0010, file = %O;
    PRG0:   start = $8000, size = $8000, file = %O;
    PRG1:   start = $8000, size = $8000, file = %O;
    CHR:    start = $0000, size = $10000, file = %O;
}

SEGMENTS {
    HEADER: load = HEADER, type = ro;
    PRG0:   load = PRG0,   type = ro;
    PRG1:   load = PRG1,   type = ro;
    CHR:    load = CHR,    type = ro;
}
